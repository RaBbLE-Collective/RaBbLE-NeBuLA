<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeBuLA — Basic Scene</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; }
  </style>

  <!-- importmap lets the browser resolve bare "three" imports with no build step -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="info">Move mouse to control entropy</div>

  <script type="module">
    import { Runtime, PatternGenerator } from '../src/index.js';

    const runtime = new Runtime('#canvas');
    const stream = runtime.createStream('scene');

    PatternGenerator.organic(200, 'sphere').forEach(e => stream.add(e));

    // TODO: set runtime.backend = new ThreeJsBackend(canvas) once implemented
    runtime.start();

    document.addEventListener('mousemove', (ev) => {
      const entropy = ev.clientX / window.innerWidth;
      stream.forEach(entity => { entity.entropy = entropy; });
    });

    // show live stats
    setInterval(() => {
      const s = runtime.getStats();
      document.getElementById('info').textContent =
        `entities: ${s.totalEntities} | entropy: ${s.averageEntropy.toFixed(2)} | fps: ${s.fps.toFixed(0)}`;
    }, 500);
  </script>
</body>
</html>

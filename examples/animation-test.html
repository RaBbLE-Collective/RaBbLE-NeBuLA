<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeBuLA — Animation Test</title>
  <style>
    body {
      margin: 0;
      background: #0a0010;
      color: #e8e6f0;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 2rem;
    }

    #canvas {
      border: 1px solid #2a2840;
      background: #0a0010;
      width: 400px;
      height: 400px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-size: 14px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-group label {
      color: #00f5ff;
      font-weight: bold;
      font-size: 12px;
    }

    button {
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid #00f5ff;
      color: #00f5ff;
      cursor: pointer;
      border-radius: 4px;
      transition: all 200ms;
    }

    button:hover {
      background: #00f5ff;
      color: #0a0010;
    }

    button.active {
      background: #00f5ff;
      color: #0a0010;
    }

    .state-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .state-buttons button {
      flex: 1;
    }

    #stats {
      color: #bf5fff;
      font-size: 12px;
      line-height: 1.6;
      border: 1px solid #2a2840;
      padding: 1rem;
      border-radius: 4px;
      background: #12132a;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2 style="margin: 0 0 1rem 0; color: #ff2d78;">AnimationMixer Test</h2>

    <div class="control-group">
      <label>Entity State</label>
      <div class="state-buttons">
        <button onclick="setState('idle')">Idle</button>
        <button onclick="setState('thinking')">Thinking</button>
        <button onclick="setState('speaking')">Speaking</button>
      </div>
    </div>

    <div class="control-group">
      <label>Animation Duration (ms)</label>
      <input type="number" id="duration" value="800" min="100" max="5000" step="100"
             style="padding: 0.5rem; background: #12132a; border: 1px solid #2a2840; color: #e8e6f0; border-radius: 4px;">
    </div>

    <button onclick="addEntities()">+ Add 50 Entities</button>
    <button onclick="clearEntities()">Clear All</button>

    <div id="stats">
      <strong>Stats:</strong><br>
      Entities: <span id="entity-count">0</span><br>
      Avg Entropy: <span id="entropy">0.00</span><br>
      FPS: <span id="fps">0</span><br>
      <br>
      <strong>Current State:</strong> <span id="current-state" style="color: #00f5ff;">idle</span>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="module">
    import { Runtime, Canvas2dBackend, PatternGenerator, AnimationMixer } from '../src/index.js';

    const canvas = document.getElementById('canvas');
    const runtime = new Runtime(canvas);

    // Use Canvas2D backend
    runtime.backend = new Canvas2dBackend(canvas);

    const stream = runtime.createStream('entities');
    let currentState = 'idle';
    let transitionDuration = 800;

    // Seed with initial entities using organic pattern
    const gen = new PatternGenerator();
    const initialEntities = gen.organic(50, { scale: 2, entropy: 0.3 });
    initialEntities.forEach(e => stream.add(e));

    // Update stats every frame
    runtime.on('frame', () => {
      const stats = runtime.getStats();
      document.getElementById('entity-count').textContent = stats.totalEntities;
      document.getElementById('entropy').textContent = stats.averageEntropy.toFixed(2);
      document.getElementById('fps').textContent = Math.round(stats.fps);
    });

    // Global functions for controls
    window.setState = (state) => {
      currentState = state;
      document.getElementById('current-state').textContent = state;

      // Update button active state
      document.querySelectorAll('.state-buttons button').forEach((btn, i) => {
        const states = ['idle', 'thinking', 'speaking'];
        btn.classList.toggle('active', states[i] === state);
      });

      // Start animation
      runtime.animator.transition(stream, state, transitionDuration);
    };

    window.addEntities = () => {
      const gen = new PatternGenerator();
      const entities = gen.organic(50, { scale: 2, entropy: 0.3 });
      entities.forEach(e => stream.add(e));
    };

    window.clearEntities = () => {
      stream.clear();
    };

    // Update duration from input
    document.getElementById('duration').addEventListener('change', (e) => {
      transitionDuration = parseInt(e.target.value);
    });

    // Start the runtime
    runtime.start();

    // Log initial state
    console.log('AnimationMixer loaded. Use setState("idle"|"thinking"|"speaking") to animate.');
    console.log('Current entities:', runtime.getStats().totalEntities);
  </script>
</body>
</html>
